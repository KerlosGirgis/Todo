name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Increase watcher limit
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # F-Droid's build reads this version with a sed: keep it quoted, with nothing after it.
          flutter-version: '3.50.1'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: disable analytics
        run: flutter config --no-analytics

      - name: Build Android APKs
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          trap 'rm -f android/app/kkey.keystore' EXIT
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > android/app/kkey.keystore
          flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64,android-x64

      - name: Upload APKs as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

      # A manual run from a branch only builds; a tag (pushed or picked) also releases.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,build/app/outputs/flutter-apk/app-x86_64-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Todo ${{ github.ref_name }}
          body: |
            ## Release Notes
            - Added subtasks. Tasks can hold subtasks nested as deep as you like, and fold to hide them. Swipe a task right to add a subtask; swipe left still deletes it.
            - Added a map view that shows your tasks as a mind map. Press and hold a task to move it, or go full screen. Open it from the menu, or make it the default with Show Tasks As in settings.
            - Tasks can now repeat weekly on chosen days or monthly on a chosen day, and can stop after a while or on a set date.
            - Replaced the task filters with Sort and Filter buttons: sort by due date, or show only Done, Undone, Daily, Weekly, Monthly or Once tasks. Your choice is remembered.
            - Deleted tasks and notes now go to a Trash, with Undo. Restore them or delete them for good from the Trash page in the menu.
            - Added a To-Do home screen widget. While App Lock is on, it shows only task counts.
            - Added style settings for both home screen widgets (colours, opacity, size and font) with a live preview, and a Clear Widget option for the note widget.
            - Added an AMOLED Black option for the dark theme, contributed by agustux in #18.
            - The notification permission is now asked for only when you turn on a reminder.
            - The To-Do and Settings pages now keep one column in landscape.
            - Android's phone-to-phone transfer no longer copies the app's data. Use Back Up and Restore to move it to a new phone.
            - Updated dependencies and fixed various bugs.
