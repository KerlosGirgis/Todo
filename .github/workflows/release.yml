name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Increase watcher limit
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'

      - name: Install dependencies
        run: flutter pub get

      - name: disable analytics
        run: flutter config --no-analytics

      - name: Build Android APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/kkey.keystore
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          echo $ANDROID_SIGNING_KEY | base64 --decode > ${{ github.workspace }}/android/app/kkey.keystore
          flutter build apk --gitHubRelease --split-per-abi --target-platform="android-arm64"

      - name: Upload APK to release
        uses: actions/upload-artifact@v3
        with:
          name: app-arm64-v8a-release.apk.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release Notes
            - Built using Flutter version: 3.27.1
            - Commit: `${{ github.sha }}`
            - Repository: [Todo](https://github.com/KerlosGirgis/Todo)
