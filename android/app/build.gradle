//        if (abiVersionCode != null) {
//            output.versionCodeOverride = variant.versionCode * 1000 + abiVersionCode
//        }
//    }
//}
android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def baseAbiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
        if (baseAbiVersionCode != null) {
            output.versionCodeOverride = (1000 * project.android.defaultConfig.versionCode) + baseAbiVersionCode
        } else {
            output.versionCodeOverride = 1000 * project.android.defaultConfig.versionCode
        }
    }
}